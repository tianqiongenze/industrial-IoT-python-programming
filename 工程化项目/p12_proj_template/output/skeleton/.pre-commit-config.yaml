# A 层：commit 前自动执行规范闸门（repo: local，离线可用，不联网拉远程仓库）
# 装钩子：pip install -r requirements-dev.txt && pre-commit install
# 全量手动：pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black .
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8 src tests --max-line-length=100
        language: system
        types: [python]
