[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p22_feature_factory"
version = "1.0.0"
description = "特征工厂（03-Python程序设计-项目实战 W04 第7次课）"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
p22_feature_factory = "feat_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]
